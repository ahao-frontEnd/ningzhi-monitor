# Docker Compose 配置文件
# 作用：用一条命令同时启动多个 Docker 容器（服务）

services:
    # ============ Kafka 消息队列服务 ============
    # Kafka 用于实时处理和传输大量数据流，类似"数据管道"，用于构建实时数据处理系统。
    ningzhi-monitor-kafka:
        image: apache/kafka                   # 使用官方 Kafka 镜像
        container_name: ningzhi-monitor-kafka # 给容器起个名字，方便管理
        ports:                                 # 端口映射：左边是宿主机端口，右边是容器内部端口
            - '9093:9093'                      # 9093: 用于程序连接 Kafka 控制器端口（集群内部使用），
            - '9094:9094'                      # 9094: Kafka 控制器端口（集群内部使用）
        environment:                           # 环境变量：配置 Kafka 的运行参数
            - KAFKA_NODE_ID=1 # 节点 ID，用于集群识别
            - KAFKA_PROCESS_ROLES=broker,controller # 节点角色，broker 是普通节点，controller 是控制器节点，
            # broker 是普通节点，用于处理消息；controller 是控制器节点，用于协调集群操作。
            - KAFKA_CONTROLLER_QUORUM_VOTERS=1@ningzhi-monitor-kafka:9093 # 使用容器名而非 IP，确保在任意环境下都能正常工作
            - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9094 # 监听端口，用于接收消息和协调集群操作，
            # 9092 是普通节点端口，用于接收消息；9093 是控制器节点端口，用于协调集群操作；0.0.0.0:9094 是外部端口，用于接收消息。
            - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://ningzhi-monitor-kafka:9092,EXTERNAL://localhost:9094 # 广播的监听端口，用于外部连接，
            # 9092 是普通节点端口，用于接收消息；9094 是外部端口，用于接收消息。
            - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT # 监听端口安全协议映射，用于指定不同监听端口的安全协议，
            - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER # 控制器节点监听端口，用于协调集群操作，
            - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT # 普通节点监听端口，用于接收消息，
        healthcheck:                           # 健康检查：用于判断 Kafka 是否完全启动（供 kafka-init 等待）
            # 注意：kafka-topics.sh 每次探针都要启动一个新 JVM（约 2-4s），
            # 部署时服务器负载高，5s 超时容易被误判成 unhealthy，放宽到 15s
            test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
            interval: 5s
            timeout: 15s
            retries: 20
            start_period: 30s
        # volumes:                              # 数据持久化：把容器内数据保存到宿主机
        #     - ./kafka_data:/bitnami/kafka/data  # 注释掉的是数据持久化配置，启用后可防止数据丢失

    # ============ Kafka 一次性初始化服务 ============
    # Kafka 4.x KIP-848 已知问题：新 group coordinator 不会自动创建 __consumer_offsets topic，
    # 导致 ClickHouse 的 Kafka 引擎表消费者收到 COORDINATOR_NOT_AVAILABLE，消息堆积不落盘。
    # 此服务在 Kafka 完全启动后自动创建必要 topics，执行完毕即退出（restart: no）。
    # --if-not-exists 保证幂等：topic 已存在时跳过，不会因重复执行报错。
    ningzhi-monitor-kafka-init:
        image: apache/kafka
        container_name: ningzhi-monitor-kafka-init
        depends_on:
            ningzhi-monitor-kafka:
                condition: service_healthy     # 等 Kafka 完全启动后再执行
        command:
            - /bin/bash
            - -c
            - |
                echo "==== Kafka init: creating required topics ===="
                # 1. __consumer_offsets（KIP-848 修复：消费者组协调器依赖此 topic）
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server ningzhi-monitor-kafka:9092 \
                  --create --if-not-exists \
                  --topic __consumer_offsets --partitions 50 --replication-factor 1 \
                  --config cleanup.policy=compact
                echo "✅ __consumer_offsets created (or already exists)"
                # 2. monitor（业务 topic，提前创建避免首次发送时的延迟）
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server ningzhi-monitor-kafka:9092 \
                  --create --if-not-exists \
                  --topic monitor --partitions 1 --replication-factor 1
                echo "✅ monitor created (or already exists)"
                echo "==== Kafka init done ===="
        restart: "no"

    # ============ ClickHouse 分析型数据库 ============
    # ClickHouse 用于快速分析大量数据，适合做数据仓库和实时分析
    ningzhi-monitor-clickhouse:
        image: clickhouse:25.10               # 使用官方 ClickHouse 镜像，版本 25.10
        container_name: ningzhi-monitor-clickhouse
        depends_on:
            ningzhi-monitor-kafka-init:
                condition: service_completed_successfully  # 等 kafka-init 创建完 topics 再启动，确保消费者能正常接入
        ports:
            - '8123:8123'                      # 8123: HTTP 接口，用于 Web UI 和 HTTP 请求
            - '9000:9000'                      # 9000: Native 接口，用于客户端工具连接
        environment:                           # 环境变量配置
            - CLICKHOUSE_USER=default          # 默认用户名
            - CLICKHOUSE_PASSWORD=ningzhiClickhouse  # 密码（建议生产环境使用更复杂的密码）
            - CLICKHOUSE_DATABASE=default      # 默认数据库
        volumes:
            # 挂载自定义配置，禁用/限制系统日志表，防止撑满磁盘
            # （历史教训：trace_log/text_log 默认无 TTL，10 天长到 25G+ 把 40G 系统盘撑爆）
            - ./clickhouse/config.d/disable_logs.xml:/etc/clickhouse-server/config.d/disable_logs.xml:ro

    # ============ PostgreSQL 关系型数据库 ============
    # PostgreSQL 是一个功能强大的开源关系型数据库，适合存储结构化数据
    ningzhi-monitor-postgresql:
        image:  postgres:18.1                  # 使用 PostgreSQL 镜像，版本 18.1
        container_name: ningzhi-monitor-postgresql
        ports:
            - '5432:5432'                      # 5432: PostgreSQL 默认端口
        environment:
            - POSTGRES_USER=postgres          # 默认用户名
            - POSTGRES_DB=postgres              # 默认数据库名
            - POSTGRES_PASSWORD=ningzhiPostgresql  # 密码（建议生产环境使用更复杂的密码）
        volumes:
            - ./postgresql_data:/bitnami/postgresql  # 数据持久化：数据库文件保存在宿主机

    # ============ Redis 内存数据库 ============
    # Redis 是一个高性能的键值存储，常用作缓存或消息队列
    ningzhi-monitor-redis:
        image:  redis:8.4                     # 使用官方 Redis 镜像，版本 8.4
        container_name: ningzhi-monitor-redis
        ports:
            - '6379:6379'                      # 6379: Redis 默认端口
        environment:
            - REDIS_PASSWORD=ningzhiRedis      # 设置密码（生产环境建议启用）
        # volumes:
        #     - ./redis_data:/bitnami/redis    # 数据持久化配置

# ============ 网络配置 ============
# 定义一个 Docker 网络，让这些容器可以互相通信
# 原理是：每个容器都有一个默认的网络，这里定义了一个自定义的网络，所有容器都可以通过这个网络相互通信
# 例如：ningzhi-monitor-kafka 可以通过 ningzhi-monitor-clickhouse-network 访问 ningzhi-monitor-clickhouse 容器的 ClickHouse 服务
# 也可以通过 ningzhi-monitor-clickhouse-network 访问 ningzhi-monitor-kafka 容器的 Kafka 服务
networks:
    default:
        name: ningzhi-monitor-network  # 网络名称
        driver: bridge  # 网络驱动，这里使用桥接模式,让容器可以与宿主机上的容器之间可以相互通信
