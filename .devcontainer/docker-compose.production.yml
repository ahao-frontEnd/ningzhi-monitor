# 生产环境部署配置
# 使用阿里云 ACR 预构建镜像，服务器拉取速度快

include:
  - docker-compose.yml

services:
  # 后端服务 - 使用 ACR 预构建镜像
  # 镜像路径通过环境变量注入，确保与 CI/CD 推送时一致
  ningzhi-monitor-server:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/ningzhi-monitor-server:latest
    container_name: ningzhi-monitor-server
    ports:
      - 8081:8081
    depends_on:
      - ningzhi-monitor-postgresql
      - ningzhi-monitor-redis
      - ningzhi-monitor-clickhouse
      - ningzhi-monitor-kafka
    restart: unless-stopped

  # dsn-server 服务 - SDK 数据上报服务
  # 镜像路径通过环境变量注入，确保与 CI/CD 推送时一致
  ningzhi-monitor-dsn-server:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/ningzhi-monitor-dsn-server:latest
    container_name: ningzhi-monitor-dsn-server
    ports:
      - 8082:8080
    environment:
      # 双写模式：Kafka 链路 + 直写 ClickHouse 兜底
      # 即使 Kafka 链路出问题，direct 写入的数据也能被查询到
      WRITE_MODE: both
    depends_on:
      - ningzhi-monitor-postgresql
      - ningzhi-monitor-redis
      - ningzhi-monitor-clickhouse
      - ningzhi-monitor-kafka
    restart: unless-stopped

  # Caddy 反向代理
  ningzhi-monitor-caddy:
    image: caddy:latest
    container_name: ningzhi-monitor-caddy
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./caddy:/etc/caddy
      - /home/ubuntu/frontend-dist:/app/frontend/monitor/dist
      - caddy_data:/data
      - caddy_config:/config
      # 无代码可视化平台前端资源挂载
      - /home/ubuntu/builder-dist:/app/frontend/builder/dist:ro # read only
      # AI Chat 平台 前端资源挂载
      - /home/ubuntu/chat-dist:/app/frontend/chat/dist:ro # read only
      # Ningzhi UI 组件库文档站挂载
      - /home/ubuntu/my-apps/ningzhi-ui:/app/frontend/uiComponents/docs-dist:ro # read only
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
