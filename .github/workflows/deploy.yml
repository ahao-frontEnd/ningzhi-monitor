name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ============ 登录阿里云 ACR ============
      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ============ 构建并推送到 ACR ============
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/monitor/Dockerfile
          push: true
          # 镜像路径使用 ACR_NAMESPACE（必须全小写），不能用 ACR_USERNAME（可能含大写）
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ningzhi-monitor-server:latest

      # ============ 构建前端 ============
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @ningzhi/monitor-client build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/monitor/dist
          retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      # ============ 在服务器上创建目标目录并清理旧文件（必须在 SCP 之前）============
      # 在这里手动清理旧文件，替代 SCP 的 rm:true
      # 原因：drone-scp v1.6.14 的 rm:true 会执行 `rm -rf <target>` 删除整个目录，
      # 紧接着 scp -t <target> 传输时目录可能尚未重建，导致 "Process exited with status 1"
      - name: Ensure target directories exist and clean on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /home/ubuntu/frontend-dist
            mkdir -p /home/ubuntu/main-monitor/.devcontainer
            # 清理旧文件（保留目录本身，避免 drone-scp rm 整个目录导致 scp 失败）
            rm -rf /home/ubuntu/frontend-dist/* 2>/dev/null || true
            rm -rf /home/ubuntu/main-monitor/.devcontainer/* 2>/dev/null || true
            echo "==== Directories prepared: ===="
            ls -la /home/ubuntu/frontend-dist/
            ls -la /home/ubuntu/main-monitor/.devcontainer/

      # ============ 上传前端文件到服务器 ============
      # 注意：
      # 1. 使用整个目录 'dist' 而非 glob 'dist/*'，避免 drone-scp 路径结构错误（参考项目记忆）
      # 2. 不使用 rm:true（会删整个 target 目录导致 scp 失败），改用 overwrite:true 覆盖同名文件
      # 3. 开启 debug:true 便于定位传输失败的具体原因
      - name: Upload frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: 'dist'
          target: '/home/ubuntu/frontend-dist'
          overwrite: true
          strip_components: 1
          debug: true

      # ============ 上传 docker-compose 配置文件到服务器 ============
      # 注意：strip_components=0 表示保留 .devcontainer 目录层级，最终路径为 /home/ubuntu/main-monitor/.devcontainer/
      - name: Upload compose configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: '.devcontainer'
          target: '/home/ubuntu/main-monitor'
          overwrite: true
          strip_components: 0
          debug: true

      # ============ 在服务器上登录 ACR 并拉取镜像 ============
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            echo "==== 1. 登录 ACR ===="
            docker login ${{ secrets.ACR_REGISTRY }} \
              -u ${{ secrets.ACR_USERNAME }} \
              -p ${{ secrets.ACR_PASSWORD }}

            echo "==== 2. 检查部署目录 ===="
            mkdir -p /home/ubuntu/main-monitor
            echo '--- .devcontainer 内容 ---'
            ls -la /home/ubuntu/main-monitor/.devcontainer/ 2>/dev/null || echo '.devcontainer 不存在'

            echo "==== 3. 导出环境变量（供 docker compose 使用）===="
            export ACR_REGISTRY=${{ secrets.ACR_REGISTRY }}
            export ACR_NAMESPACE=${{ secrets.ACR_NAMESPACE }}
            echo "镜像路径: ${ACR_REGISTRY}/${ACR_NAMESPACE}/ningzhi-monitor-server:latest"

            echo "==== 4. 拉取最新后端镜像 ===="
            docker pull ${ACR_REGISTRY}/${ACR_NAMESPACE}/ningzhi-monitor-server:latest

            echo "==== 5. 确保基础设施运行 ===="
            cd /home/ubuntu/main-monitor
            # 启动所有基础设施（如果未运行）
            docker compose -f .devcontainer/docker-compose.production.yml up -d \
              ningzhi-monitor-postgresql \
              ningzhi-monitor-redis \
              ningzhi-monitor-clickhouse \
              ningzhi-monitor-kafka
            # 等数据库就绪
            sleep 15

            echo "==== 6. 重启后端服务 ===="
            docker compose -f .devcontainer/docker-compose.production.yml up -d \
              --no-deps \
              --force-recreate \
              ningzhi-monitor-server

            echo "==== 7. 重建 Caddy 容器（加载最新前端文件）===="
            # 必须用 --force-recreate 重建 Caddy，否则不会重新挂载前端目录
            docker compose -f .devcontainer/docker-compose.production.yml up -d \
              --no-deps \
              --force-recreate \
              ningzhi-monitor-caddy

            echo "==== 8. 验证前端文件挂载 ===="
            echo '--- 宿主机前端文件 ---'
            ls -la /home/ubuntu/frontend-dist/ | head -10
            echo '--- 容器内前端文件 ---'
            docker exec ningzhi-monitor-caddy ls -la /app/frontend/monitor/dist/ | head -10
            echo '--- 检查新文案 ---'
            docker exec ningzhi-monitor-caddy grep -rl "test cicd" /app/frontend/monitor/dist/assets/ 2>/dev/null \
              && echo '✅ 新文案已生效' \
              || echo '⚠️ 警告: 新文案未生效，请检查挂载'

            echo "==== 9. 部署完成，查看容器状态 ===="
            docker compose -f .devcontainer/docker-compose.production.yml ps

            echo "==== 9. 清理旧镜像 ===="
            docker image prune -f --filter "until=24h" || true
