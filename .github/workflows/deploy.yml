name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ============ 登录阿里云 ACR ============
      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ============ 构建并推送到 ACR ============
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/monitor/Dockerfile
          push: true
          # provenance 只是构建来源元数据，不影响镜像运行 ，关闭后可以避免 ACR 报错
          # ACR 不支持 OCI attestation 清单（application/vnd.oci.empty.v1+json），必须关闭 provenance
          provenance: false
          # 镜像路径使用 ACR_NAMESPACE（必须全小写），不能用 ACR_USERNAME（可能含大写）
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ningzhi-monitor-server:latest

      - name: Build and push dsn-server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/dsn-server/Dockerfile
          push: true
          provenance: false
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ningzhi-monitor-dsn-server:latest

      # ============ 构建前端 ============
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @ningzhi/monitor-client build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/monitor/dist
          retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      # ============ 配置 SSH agent（供 rsync 使用）============
      # 放弃 appleboy/scp-action（drone-scp v1.6.14 持续报 status 1 且错误信息被 mask 成 ***），
      # 改用 webfactory/ssh-agent + rsync，更稳定且错误信息清晰
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # ============ 确保服务器目标目录存在 ============
      - name: Ensure target directories exist on server
        run: |
          ssh -p 22 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'mkdir -p /home/ubuntu/frontend-dist /home/ubuntu/main-monitor/.devcontainer && echo OK'

      # ============ 同步前端文件到服务器（rsync）============
      # rsync --delete 等价于清理旧文件，但不会删除整个目录导致传输失败
      # 注意 source 末尾的 / ：dist/ 表示同步目录内容，dist 表示同步目录本身
      - name: Sync frontend to server
        run: |
          rsync -avz --delete \
            -e "ssh -p 22" \
            dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/ubuntu/frontend-dist/

      # ============ 同步 docker-compose 配置到服务器（rsync）============
      - name: Sync compose configs to server
        run: |
          rsync -avz --delete \
            -e "ssh -p 22" \
            .devcontainer/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/ubuntu/main-monitor/.devcontainer/

      # ============ 在服务器上登录 ACR 并拉取镜像 ============
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            echo "==== 1. 登录 ACR ===="
            docker login ${{ secrets.ACR_REGISTRY }} \
              -u ${{ secrets.ACR_USERNAME }} \
              -p ${{ secrets.ACR_PASSWORD }}

            echo "==== 2. 检查部署目录 ===="
            mkdir -p /home/ubuntu/main-monitor
            echo '--- .devcontainer 内容 ---'
            ls -la /home/ubuntu/main-monitor/.devcontainer/ 2>/dev/null || echo '.devcontainer 不存在'

            echo "==== 3. 导出环境变量（供 docker compose 使用）===="
            export ACR_REGISTRY=${{ secrets.ACR_REGISTRY }}
            export ACR_NAMESPACE=${{ secrets.ACR_NAMESPACE }}
            echo "镜像路径: ${ACR_REGISTRY}/${ACR_NAMESPACE}/ningzhi-monitor-server:latest"
            echo "dsn-server 镜像路径: ${ACR_REGISTRY}/${ACR_NAMESPACE}/ningzhi-monitor-dsn-server:latest"

            echo "==== 4. 拉取最新后端镜像 ===="
            docker pull ${ACR_REGISTRY}/${ACR_NAMESPACE}/ningzhi-monitor-server:latest
            docker pull ${ACR_REGISTRY}/${ACR_NAMESPACE}/ningzhi-monitor-dsn-server:latest

            echo "==== 5. 确保基础设施运行 ===="
            cd /home/ubuntu/main-monitor
            # 启动所有基础设施（如果未运行）
            docker compose -f .devcontainer/docker-compose.production.yml up -d \
              ningzhi-monitor-postgresql \
              ningzhi-monitor-redis \
              ningzhi-monitor-clickhouse \
              ningzhi-monitor-kafka
            # 等数据库就绪
            sleep 15

            echo "==== 6. 重启后端服务 ===="
            docker compose -f .devcontainer/docker-compose.production.yml up -d \
              --no-deps \
              --force-recreate \
              ningzhi-monitor-server

            echo "==== 6.1 重启 dsn-server 服务 ===="
            docker compose -f .devcontainer/docker-compose.production.yml up -d \
              --no-deps \
              --force-recreate \
              ningzhi-monitor-dsn-server

            echo "==== 7. 重建 Caddy 容器（加载最新前端文件）===="
            # 必须用 --force-recreate 重建 Caddy，否则不会重新挂载前端目录
            docker compose -f .devcontainer/docker-compose.production.yml up -d \
              --no-deps \
              --force-recreate \
              ningzhi-monitor-caddy

            echo "==== 8. 验证前端文件挂载 ===="
            echo '--- 宿主机前端文件 ---'
            ls -la /home/ubuntu/frontend-dist/ | head -10
            echo '--- 容器内前端文件 ---'
            docker exec ningzhi-monitor-caddy ls -la /app/frontend/monitor/dist/ | head -10
            echo '--- 检查新文案 ---'
            docker exec ningzhi-monitor-caddy grep -rl "test cicd" /app/frontend/monitor/dist/assets/ 2>/dev/null \
              && echo '✅ 新文案已生效' \
              || echo '⚠️ 警告: 新文案未生效，请检查挂载'

            echo "==== 9. 部署完成，查看容器状态 ===="
            docker compose -f .devcontainer/docker-compose.production.yml ps

            echo "==== 9. 清理旧镜像 ===="
            docker image prune -f --filter "until=24h" || true
